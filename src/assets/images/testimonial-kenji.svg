<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGlowK" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1B2532"/>
      <stop offset="60%" stop-color="#0E141B"/>
      <stop offset="100%" stop-color="#080B10"/>
    </radialGradient>
    <linearGradient id="skinKenji" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#DDB99C"/>
      <stop offset="50%" stop-color="#C29D7F"/>
      <stop offset="100%" stop-color="#9E785D"/>
    </linearGradient>
    <linearGradient id="sweaterKenji" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18222E"/>
      <stop offset="60%" stop-color="#101720"/>
      <stop offset="100%" stop-color="#090D12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGlowK)"/>

  <!-- Perception vector overlay circles -->
  <g opacity="0.18" stroke="#55B8FF" stroke-width="1">
    <circle cx="200" cy="180" r="120" stroke-dasharray="4 4" fill="none"/>
  </g>

  <!-- Shoulders & Dark Zip-Neck Knit -->
  <path d="M70 400 L105 280 Q150 250 200 248 Q250 250 295 280 L330 400 Z" fill="url(#sweaterKenji)"/>
  <!-- Collar & Metallic Zip Detail -->
  <path d="M165 248 L200 295 L235 248" fill="#141C26" stroke="#273644" stroke-width="1.5"/>
  <line x1="200" y1="260" x2="200" y2="330" stroke="#55B8FF" stroke-width="1.8" opacity="0.7"/>

  <!-- Neck -->
  <rect x="175" y="195" width="50" height="60" rx="8" fill="url(#skinKenji)"/>

  <!-- Head -->
  <ellipse cx="200" cy="165" rx="64" ry="82" fill="url(#skinKenji)"/>

  <!-- Black styled hair -->
  <path d="M135 155 C132 95, 165 72, 200 72 C235 72, 268 95, 265 155 C260 115, 235 88, 200 88 C165 88, 140 115, 135 155 Z" fill="#121316"/>
  <ellipse cx="200" cy="95" rx="58" ry="18" fill="#1A1C20"/>
  <!-- Sideburns -->
  <rect x="135" y="145" width="8" height="24" fill="#121316" rx="2"/>
  <rect x="257" y="145" width="8" height="24" fill="#121316" rx="2"/>

  <!-- Ears -->
  <ellipse cx="134" cy="170" rx="7" ry="15" fill="#BD9779"/>
  <ellipse cx="266" cy="170" rx="7" ry="15" fill="#BD9779"/>

  <!-- Eyebrows & Eyes -->
  <path d="M160 145 Q174 140 188 144" stroke="#121316" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M212 144 Q226 140 240 145" stroke="#121316" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="174" cy="155" rx="8" ry="4.5" fill="#F4F7FA" opacity="0.9"/>
  <circle cx="175" cy="155" r="3.6" fill="#121316"/>
  <circle cx="176" cy="154" r="1.1" fill="#FFFFFF"/>
  <ellipse cx="226" cy="155" rx="8" ry="4.5" fill="#F4F7FA" opacity="0.9"/>
  <circle cx="225" cy="155" r="3.6" fill="#121316"/>
  <circle cx="226" cy="154" r="1.1" fill="#FFFFFF"/>

  <!-- Thin-framed glasses -->
  <rect x="156" y="146" width="34" height="20" rx="3" fill="none" stroke="#273644" stroke-width="1.4"/>
  <rect x="210" y="146" width="34" height="20" rx="3" fill="none" stroke="#273644" stroke-width="1.4"/>
  <line x1="190" y1="154" x2="210" y2="154" stroke="#273644" stroke-width="1.4"/>
  <line x1="140" y1="152" x2="156" y2="152" stroke="#273644" stroke-width="1.2"/>
  <line x1="244" y1="152" x2="260" y2="152" stroke="#273644" stroke-width="1.2"/>

  <!-- Nose -->
  <path d="M199 150 L196 182 Q190 190 200 191 Q210 190 204 182 L201 150" fill="#9C775D" opacity="0.45"/>

  <!-- Mouth -->
  <path d="M182 208 Q200 214 218 208" stroke="#704B35" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Subtle perception reticle overlay -->
  <g opacity="0.55">
    <rect x="280" y="45" width="85" height="30" rx="3" fill="#080B10" stroke="#273644" stroke-width="1"/>
    <text x="290" y="64" fill="#54E4D3" font-size="8" font-family="JetBrains Mono, monospace">PERCEPT_L3</text>
  </g>
</svg>

