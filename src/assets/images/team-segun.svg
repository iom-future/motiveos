<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="bgGlowS" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A242F"/>
      <stop offset="55%" stop-color="#0E151D"/>
      <stop offset="100%" stop-color="#080B10"/>
    </radialGradient>
    <linearGradient id="skinSegun" x1="25%" y1="20%" x2="75%" y2="80%">
      <stop offset="0%" stop-color="#734730"/>
      <stop offset="50%" stop-color="#583522"/>
      <stop offset="100%" stop-color="#3B2013"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2824"/>
      <stop offset="50%" stop-color="#141C1A"/>
      <stop offset="100%" stop-color="#0B100F"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A21"/>
      <stop offset="100%" stop-color="#090D12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGlowS)"/>

  <!-- Simulation Grid Background lines -->
  <g opacity="0.16" stroke="#54E4D3" stroke-width="1" stroke-dasharray="3 4">
    <line x1="60" y1="0" x2="60" y2="800"/>
    <line x1="180" y1="0" x2="180" y2="800"/>
    <line x1="420" y1="0" x2="420" y2="800"/>
    <line x1="540" y1="0" x2="540" y2="800"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="440" x2="600" y2="440"/>
  </g>

  <!-- Shoulders & Dark Technical Overshirt -->
  <path d="M100 800 L145 550 Q210 500 270 495 L330 495 Q390 500 455 550 L500 800 Z" fill="url(#jacket)"/>
  <!-- Dark inner tee -->
  <path d="M245 495 L300 580 L355 495 Z" fill="url(#shirt)"/>
  <!-- Lapels -->
  <path d="M210 515 L260 620 L275 620 L250 500 Z" fill="#24332D" opacity="0.8"/>
  <path d="M390 515 L340 620 L325 620 L350 500 Z" fill="#24332D" opacity="0.8"/>

  <!-- Neck -->
  <rect x="265" y="380" width="70" height="100" rx="12" fill="url(#skinSegun)"/>

  <!-- Head -->
  <ellipse cx="300" cy="305" rx="92" ry="122" fill="url(#skinSegun)"/>

  <!-- Clean low fade haircut -->
  <path d="M208 275 C205 195, 250 170, 300 170 C350 170, 395 195, 392 275 C385 220, 350 188, 300 188 C250 188, 215 220, 208 275 Z" fill="#120D0A"/>
  <ellipse cx="300" cy="195" rx="84" ry="26" fill="#17110D"/>

  <!-- Ears -->
  <ellipse cx="206" cy="308" rx="11" ry="22" fill="#50301E"/>
  <ellipse cx="394" cy="308" rx="11" ry="22" fill="#50301E"/>

  <!-- Brows & Eyes -->
  <path d="M242 270 Q262 264 282 270" stroke="#120D0A" stroke-width="4.2" stroke-linecap="round" fill="none"/>
  <path d="M318 270 Q338 264 358 270" stroke="#120D0A" stroke-width="4.2" stroke-linecap="round" fill="none"/>
  <ellipse cx="262" cy="286" rx="11.5" ry="6.5" fill="#F4F7FA" opacity="0.88"/>
  <circle cx="264" cy="286" r="4.8" fill="#140E0A"/>
  <circle cx="265" cy="285" r="1.4" fill="#FFFFFF"/>
  <ellipse cx="338" cy="286" rx="11.5" ry="6.5" fill="#F4F7FA" opacity="0.88"/>
  <circle cx="336" cy="286" r="4.8" fill="#140E0A"/>
  <circle cx="337" cy="285" r="1.4" fill="#FFFFFF"/>

  <!-- Nose & Smile -->
  <path d="M298 280 L294 326 Q284 338 300 340 Q316 338 306 326 L302 280" fill="#3D2012" opacity="0.55"/>
  <!-- Confident slight smile -->
  <path d="M266 364 Q300 378 334 364" stroke="#2B140A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M272 365 Q300 373 328 365" stroke="#7A4832" stroke-width="1.8" fill="none"/>

  <!-- Subtle beard shadow -->
  <path d="M245 340 Q248 405 300 415 Q352 405 355 340 Q340 395 300 405 Q260 395 245 340 Z" fill="#1C140F" opacity="0.45"/>

  <!-- Simulation telemetry overlay -->
  <g opacity="0.6">
    <rect x="70" y="140" width="95" height="42" rx="4" fill="#080B10" stroke="#273644" stroke-width="1"/>
    <text x="80" y="157" fill="#54E4D3" font-size="9" font-family="JetBrains Mono, monospace">SIM_FREQ: 1kHz</text>
    <text x="80" y="172" fill="#93A1B0" font-size="9" font-family="JetBrains Mono, monospace">PASS: 99.8%</text>
  </g>
</svg>

