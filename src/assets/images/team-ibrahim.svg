<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#18232E"/>
      <stop offset="60%" stop-color="#0E141B"/>
      <stop offset="100%" stop-color="#080B10"/>
    </radialGradient>
    <linearGradient id="skinGrad" x1="30%" y1="20%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#6E442D"/>
      <stop offset="50%" stop-color="#553320"/>
      <stop offset="100%" stop-color="#3C2114"/>
    </linearGradient>
    <linearGradient id="skinHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#825237"/>
      <stop offset="100%" stop-color="#4C2B1B"/>
    </linearGradient>
    <linearGradient id="turtleneck" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1B2430"/>
      <stop offset="60%" stop-color="#101720"/>
      <stop offset="100%" stop-color="#090E14"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55B8FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#54E4D3" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGlow)"/>

  <!-- Spatial grid context lines -->
  <g opacity="0.18" stroke="#273644" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="520" y1="0" x2="520" y2="800"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="540" x2="600" y2="540"/>
  </g>

  <!-- Torso & Shoulders: Charcoal Turtleneck -->
  <path d="M120 800 L160 560 Q210 510 260 500 L340 500 Q390 510 440 560 L480 800 Z" fill="url(#turtleneck)"/>
  <!-- Shoulder seam & texture lines -->
  <path d="M160 560 Q220 590 300 595 Q380 590 440 560" stroke="#222F3E" stroke-width="2" fill="none"/>
  <!-- Turtleneck collar -->
  <rect x="250" y="440" width="100" height="75" rx="14" fill="#141C26" stroke="#273644" stroke-width="1.5"/>
  <path d="M255 465 Q300 475 345 465" stroke="#273644" stroke-width="1.5" fill="none"/>
  <path d="M255 490 Q300 500 345 490" stroke="#273644" stroke-width="1.5" fill="none"/>

  <!-- Neck -->
  <rect x="264" y="380" width="72" height="90" rx="10" fill="url(#skinGrad)"/>

  <!-- Head / Face -->
  <ellipse cx="300" cy="310" rx="95" ry="125" fill="url(#skinGrad)"/>
  <!-- Cheekbone & temple highlight -->
  <path d="M220 280 Q250 250 300 248 Q350 250 380 280 Q370 340 345 375 Q300 415 255 375 Z" fill="url(#skinHighlight)" opacity="0.6"/>

  <!-- Short trimmed hair & fade -->
  <path d="M205 280 C200 200, 250 175, 300 175 C350 175, 400 200, 395 280 C390 230, 350 195, 300 195 C250 195, 210 230, 205 280 Z" fill="#120D0A"/>
  <!-- Hair texture -->
  <ellipse cx="300" cy="205" rx="88" ry="32" fill="#1A130F" opacity="0.9"/>

  <!-- Ears -->
  <ellipse cx="204" cy="315" rx="12" ry="24" fill="#4C2B1B"/>
  <ellipse cx="396" cy="315" rx="12" ry="24" fill="#4C2B1B"/>

  <!-- Eyes & Eyebrows -->
  <path d="M240 275 Q262 268 280 274" stroke="#120D0A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M320 274 Q338 268 360 275" stroke="#120D0A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Eyes -->
  <ellipse cx="260" cy="292" rx="12" ry="7" fill="#F4F7FA" opacity="0.85"/>
  <circle cx="262" cy="292" r="5" fill="#1A130F"/>
  <circle cx="263" cy="291" r="1.5" fill="#FFFFFF"/>
  <ellipse cx="340" cy="292" rx="12" ry="7" fill="#F4F7FA" opacity="0.85"/>
  <circle cx="338" cy="292" r="5" fill="#1A130F"/>
  <circle cx="339" cy="291" r="1.5" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M298 285 L294 330 Q285 342 300 345 Q315 342 306 330 L302 285" fill="#3D2012" opacity="0.6"/>

  <!-- Neat Beard & Mustache -->
  <path d="M255 358 Q300 366 345 358 Q348 372 338 376 Q300 384 262 376 Z" fill="#15100C"/>
  <path d="M230 320 Q235 410 300 422 Q365 410 370 320 Q358 370 338 400 Q300 416 262 400 Q242 370 230 320 Z" fill="#15100C"/>
  <path d="M272 368 Q300 374 328 368" stroke="#3D2012" stroke-width="2" fill="none"/>

  <!-- Subtle Rim Light -->
  <path d="M205 220 Q200 330 220 400 L212 402 Q194 330 200 220 Z" fill="url(#rimLight)"/>
  <path d="M395 220 Q400 330 380 400 L388 402 Q406 330 400 220 Z" fill="url(#rimLight)"/>

  <!-- Spatial intelligence HUD reticle -->
  <g opacity="0.65">
    <circle cx="480" cy="180" r="38" stroke="#55B8FF" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
    <circle cx="480" cy="180" r="3" fill="#54E4D3"/>
    <line x1="440" y1="180" x2="520" y2="180" stroke="#55B8FF" stroke-width="0.8"/>
    <line x1="480" y1="140" x2="480" y2="220" stroke="#55B8FF" stroke-width="0.8"/>
    <text x="430" y="235" fill="#55B8FF" font-size="10" font-family="JetBrains Mono, monospace">NODE_GRAPH: 3D</text>
  </g>
</svg>

